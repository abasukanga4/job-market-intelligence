name: Validate and reproduce analysis
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests -v
      - run: python -m src.analyse --figures figures
      - run: python -m src.write_report
      - run: python -m src.build_notebook
      - run: python -m ipykernel install --sys-prefix --name job-market-python
      - run: python -m nbconvert --to notebook --execute notebooks/market_eda.ipynb --inplace --ExecutePreprocessor.kernel_name=job-market-python --ExecutePreprocessor.timeout=180
      - run: git diff --exit-code -- data/jobs_snapshot.csv
